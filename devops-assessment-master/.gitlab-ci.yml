# GitLab CI pipeline for the DevOps assessment service.
stages:
  - commit-lint
  - lint
  - build
  - test
  - package
  - deploy
variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

lint:commit-message:
  stage: commit-lint
  image: alpine:3.20
  script:
    - echo "Validating commit message:"
    - echo "$CI_COMMIT_TITLE"
    - |
      if ! echo "$CI_COMMIT_TITLE" | grep -Eq '^[A-Z][A-Z0-9]+-[0-9]+'; then
        echo "ERROR: commit message must start with a ticket reference like 'TICKET-1'";
        exit 1;
      fi

lint:python:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check --select E9,F app
    
lint:helm:
  stage: lint
  image: alpine/helm:3.15.2
  script:
    - helm lint helm
    - helm template homework helm > /dev/null

lint:terraform:
  stage: lint
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd terraform
    - terraform fmt -check -recursive || echo "warning: terraform files are not canonically formatted"
    - terraform init -backend=false
    - terraform validate


build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" app
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"


test:app:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd app
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
  script:
    - pytest -q


package:helm:
  stage: package
  image: alpine/helm:3.15.2
  script:
    - helm template homework helm --set image.repository="$IMAGE_NAME" --set image.tag="$IMAGE_TAG" > rendered.yaml
    - helm package helm --destination .
  artifacts:
    paths:
      - rendered.yaml
      - "*.tgz"
    expire_in: 1 week


deploy:prod:
  stage: deploy
  image: alpine/helm:3.15.2
  script:
    - echo "Deploying to production..."
    - >-
      helm upgrade --install homework helm
      --namespace homework --create-namespace
      --set image.repository="$IMAGE_NAME"
      --set image.tag="$IMAGE_TAG"
      --set environment=prod
      --set persistence.enabled=true
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
